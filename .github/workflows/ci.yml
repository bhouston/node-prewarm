name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Report coverage and size
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node --input-type=module -e 'import fs from "node:fs"; const c = JSON.parse(fs.readFileSync("coverage/coverage-summary.json")).total; for (const [k,v] of Object.entries(c)) console.log(`${k}: ${v.pct}%`);' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -d dist ]; then
            pnpm size >> "$GITHUB_STEP_SUMMARY" 2>&1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  contribution:
    name: Contribution policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR branch, issue link, and title
        run: node scripts/check-pr.mjs
      - name: Lint feature commits
        if: github.base_ref == 'dev'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
